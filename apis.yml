name: Nia Health
description: >-
  Nia Health GmbH is a Berlin-based digital health company and spin-off of
  Charité Universitätsmedizin Berlin that develops Nia, a mobile medical
  application supporting people living with atopic dermatitis (neurodermatitis)
  and other chronic skin conditions. Nia was the first atopic dermatitis app
  approved as a medical device, helping patients document flare-ups, identify
  triggers such as stress or fragrances, and manage their therapy day to day.
  The company builds a patient-engagement platform that turns real-world
  behavioral and symptom data into insights for patients, physicians, and
  research partners including pharmaceutical companies such as Sanofi. Nia
  Health is a consumer- and clinician-facing mobile product; it exposes no
  public developer API, developer portal, SDK, or machine-readable API
  surface. This profile was surfaced as a portfolio company of Version One
  Ventures and enriched from public sources.
